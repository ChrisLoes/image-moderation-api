name: 🔐 Auto-Merge & Publish Security Updates

on:
  pull_request:
    paths:
      - requirements.txt
      - Dockerfile
      - .github/workflows/**

permissions:
  pull-requests: write
  contents: write
  checks: read

jobs:
  test:
    name: Test Update
    runs-on: ubuntu-latest
    if: github.actor == 'dependabot[bot]'

    steps:
      - name: Checkout PR
        uses: actions/checkout@v7
        with:
          ref: ${{ github.head_ref }}

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: '3.12'
          cache: 'pip'

      - name: Install system libraries for MediaPipe
        run: sudo apt-get update && sudo apt-get install -y libegl1 libgles2

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install pytest pytest-cov pytest-asyncio pytest-timeout
          pip install -r requirements.txt

      # Must fail on errors: a green result here auto-merges the update
      # (mediapipe 1.1.0 was merged although it broke the app)
      - name: Run tests
        run: |
          pytest tests/test_api.py tests/test_detectors.py -v --tb=short

      - name: Build Docker image
        run: |
          docker build -t test-image:latest .

  auto-merge:
    name: Auto-Merge Security Updates
    needs: test
    runs-on: ubuntu-latest
    if: github.actor == 'dependabot[bot]' && needs.test.result == 'success'

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      # GITHUB_TOKEN may not merge changes to workflow files, so GitHub Actions
      # updates are merged by hand.
      - name: Enable auto-merge for Dependabot PRs
        if: ${{ !startsWith(github.head_ref, 'dependabot/github_actions/') }}
        run: |
          gh pr merge --auto --squash \
            "${{ github.event.pull_request.number }}" \
            --delete-branch
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Comment on PR
        if: ${{ !startsWith(github.head_ref, 'dependabot/github_actions/') }}
        uses: actions/github-script@v9
        with:
          script: |
            github.rest.issues.createComment({
              issue_number: context.issue.number,
              owner: context.repo.owner,
              repo: context.repo.repo,
              body: '✅ Security update verified and approved!\n\n- ✓ Tests passed\n- ✓ Docker image builds successfully\n- ✓ Auto-merging...\n\nNew image will be published to Docker Hub after merge.'
            })

  publish:
    name: Publish Updated Image
    needs: auto-merge
    runs-on: ubuntu-latest
    if: github.actor == 'dependabot[bot]' && !startsWith(github.head_ref, 'dependabot/github_actions/')

    steps:
      - name: Wait for merge
        run: sleep 10

      - name: Checkout merged code
        uses: actions/checkout@v7
        with:
          ref: master

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Log in to Docker Hub
        uses: docker/login-action@v4
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build and push
        uses: docker/build-push-action@v7
        with:
          context: .
          push: true
          tags: |
            ${{ secrets.DOCKERHUB_USERNAME }}/image-moderation-api:latest
            ${{ secrets.DOCKERHUB_USERNAME }}/image-moderation-api:security-update-${{ github.run_number }}
          cache-from: type=registry,ref=${{ secrets.DOCKERHUB_USERNAME }}/image-moderation-api:buildcache
          cache-to: type=registry,ref=${{ secrets.DOCKERHUB_USERNAME }}/image-moderation-api:buildcache,mode=max

      - name: Comment success
        uses: actions/github-script@v9
        with:
          script: |
            github.rest.issues.createComment({
              issue_number: context.issue.number,
              owner: context.repo.owner,
              repo: context.repo.repo,
              body: '🚀 Security update published!\n\n- Merged to master\n- New Docker image built and pushed to Docker Hub\n- Ready for deployment'
            })
